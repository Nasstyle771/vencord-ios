name: Vencord iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Tweak (${{ matrix.scheme }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: rootless
          - scheme: roothide
    env:
      THEOS: ${{ github.workspace }}/.theos
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.theos
          key: roothide-theos-${{ runner.os }}-v1

      - name: Setup Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Package
        run: |
          make clean
          make package FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME="${{ matrix.scheme }}" \
            DISABLE_ROOTLESS_COMPAT_WARNING=1

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VencordIOS-deb-${{ matrix.scheme }}
          path: packages/*.deb

  package_dylib:
    name: Package Tweak Dylib
    needs: build
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/.theos
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.theos
          key: roothide-theos-${{ runner.os }}-v1

      - name: Setup Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Tweak Dylib
        run: |
          make clean
          FINALPACKAGE=1 make
          mkdir -p output_dylib
          find .theos/obj -name "*.dylib" -exec cp {} output_dylib/ \; || true

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VencordIOS-Dylib
          path: output_dylib/*.dylib
